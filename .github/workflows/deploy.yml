# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Use Node.js
        uses: actions/setup-node@v4
      - name: Install dependencies
        run: npm install
      - name: Patch URL
        run: |
          # use the secret URL if it is set, otherwise use the default URL
          if [ -z "$SECRET_URL" ]; then
            URL=$DEPLOY_URL
          else
            URL=$SECRET_URL
          fi
          echo "Patching URL in hugo.toml to $URL"
          sed -i "s#baseURL = .*#baseURL = '$URL'#" hugo.toml
          head -n 2 hugo.toml
        env:
          DEPLOY_URL: https://${{ github.event.repository.owner.name }}.github.io/${{ github.event.repository.name }}/
          SECRET_URL: ${{ secrets.URL }}
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
